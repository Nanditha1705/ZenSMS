spring.application.name=sms
# =====================
# Server
# =====================
server.port=8081
server.servlet.context-path=/

# ====================j==
# Database
# =====================
spring.datasource.url=jdbc:mysql://root:JsRiVHfbtbICwmHiSihjfEnsmdTvggnj@altaria.proxy.rlwy.net:34732/railway
spring.datasource.username=root
spring.datasource.password=JsRiVHfbtbICwmHiSihjfEnsmdTvggnj
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =====================
# JPA / Hibernate
# =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================
# Thymeleaf
# =====================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.enable-spring-el-compiler=true

# =====================
# File Upload
# =====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/marks

# =====================
# Session
# =====================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# =====================
# Logging
# =====================
logging.level.com.sms=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG