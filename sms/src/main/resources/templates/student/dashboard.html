<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: studentNav}"></div>

<div class="container py-4">
    <!-- Welcome Banner -->
    <div class="card border-0 shadow-sm mb-4"
         style="background: linear-gradient(135deg,#0f3460,#533483); color:white;">
        <div class="card-body d-flex align-items-center gap-4 py-4">
            <div class="rounded-circle bg-white text-primary d-flex align-items-center justify-content-center fw-bold fs-2"
                 style="width:70px;height:70px"
                 th:text="${student.fullName.substring(0,1).toUpperCase()}"></div>
            <div>
                <h3 class="mb-1" th:text="'Welcome, ' + ${student.fullName}"></h3>
                <span class="opacity-75" th:text="'Roll No: ' + ${student.rollNumber}"></span>
            </div>
        </div>
    </div>

    <!-- Info Cards -->
    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm text-center py-3">
                <div class="card-body">
                    <i class="bi bi-building fs-1 text-primary"></i>
                    <h5 class="mt-2" th:text="${student.department?.name ?: 'Not Assigned'}"></h5>
                    <p class="text-muted mb-0">Department</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm text-center py-3">
                <div class="card-body">
                    <i class="bi bi-layers fs-1 text-success"></i>
                    <h5 class="mt-2" th:text="${student.semester > 0 ? 'Semester ' + student.semester : 'N/A'}"></h5>
                    <p class="text-muted mb-0">Current Semester</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm text-center py-3">
                <div class="card-body">
                    <i class="bi bi-envelope fs-1 text-warning"></i>
                    <h5 class="mt-2" th:text="${student.email ?: '—'}"></h5>
                    <p class="text-muted mb-0">Email</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="row g-3">
        <div class="col-md-6">
            <a th:href="@{/student/marks}" class="card border-0 shadow-sm text-decoration-none text-dark">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-journal-text fs-1 text-primary"></i>
                    <div>
                        <h6 class="mb-0">View Mark Sheet</h6>
                        <small class="text-muted">See all subject marks</small>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-6">
            <a th:href="@{/student/attendance}" class="card border-0 shadow-sm text-decoration-none text-dark">
                <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-calendar-check fs-1 text-success"></i>
                    <div>
                        <h6 class="mb-0">Mark Attendance</h6>
                        <small class="text-muted">Mark today's attendance</small>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
