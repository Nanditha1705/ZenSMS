<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="adminNav" class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-mortarboard-fill me-2"></i>SMS Admin
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/students}"><i class="bi bi-people me-1"></i>Students</a></li>

            <li class="nav-item"><a class="nav-link" th:href="@{/admin/marks}"><i class="bi bi-clipboard-data me-1"></i>Marks</a></li>

            <button class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
        </form>
    </div>
</nav>

<nav th:fragment="studentNav" class="navbar navbar-expand-lg navbar-dark bg-primary px-4">
    <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-mortarboard-fill me-2"></i>SMS Student
    </a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">

            <li class="nav-item"><a class="nav-link" th:href="@{/student/attendance}"><i class="bi bi-calendar-check me-1"></i>Attendance</a></li>
        </ul>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
        </form>
    </div>

</html>
