<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
<div class="text-center">
    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:5rem"></i>
    <h2 class="mt-3">Oops! Something went wrong.</h2>
    <p class="text-muted" th:text="${errorMessage} ?: 'An unexpected error occurred.'"></p>
    <a href="/login" class="btn btn-primary mt-2">
        <i class="bi bi-house me-1"></i>Go to Login
    </a>
</div>
</body>
</html>
