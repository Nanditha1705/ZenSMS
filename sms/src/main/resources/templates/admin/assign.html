<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Assign Department</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: adminNav}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0"><i class="bi bi-person-check me-2"></i>Assign Department & Semester</h5>
                </div>
                <div class="card-body">
                    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show">
                        <i class="bi bi-check-circle me-2"></i>Assigned successfully!
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <form th:action="@{/admin/assign}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Student</label>
                            <select name="studentId" class="form-select">
                                <option value="" disabled selected>-- Choose Student --</option>
                                <option th:each="s : ${students}"
                                        th:value="${s.id}"
                                        th:text="${s.fullName + ' (' + s.rollNumber + ')'}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Department</label>
                            <select name="departmentId" class="form-select">
                                <option value="" disabled selected>-- Choose Department --</option>
                                <option th:each="d : ${departments}"
                                        th:value="${d.id}"
                                        th:text="${d.name}"></option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Semester</label>
                            <select name="semester" class="form-select">
                                <option th:each="i : ${#numbers.sequence(1,8)}"
                                        th:value="${i}"
                                        th:text="'Semester ' + ${i}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-semibold">
                            <i class="bi bi-save me-1"></i>Save Assignment
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
