<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Manage Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: adminNav}"></div>

<div class="container py-4">
    <div class="row g-4">

        <!-- Add Student Form -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-person-plus me-2"></i>Add New Student</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/students/add}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input name="fullName" class="form-control" placeholder="e.g. Ravi Kumar" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Roll Number</label>
                            <input name="rollNumber" class="form-control" placeholder="e.g. CS2021001" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input name="email" type="email" class="form-control" placeholder="student@email.com"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input name="phone" class="form-control" placeholder="10-digit number"/>
                        </div>
                        <hr/>
                        <p class="text-muted small mb-2"><i class="bi bi-info-circle me-1"></i>Login credentials</p>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input name="username" class="form-control" placeholder="Login username" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input name="password" type="password" class="form-control" placeholder="Password" required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-plus-circle me-1"></i>Add Student
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Students List -->
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="bi bi-people me-2"></i>Student List</h5>
                    <span class="badge bg-primary" th:text="${students.size()} + ' students'"></span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-secondary">
                                <tr>
                                    <th>#</th>
                                    <th>Roll No</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s, i : ${students}">
                                    <td th:text="${i.count}"></td>
                                    <td><span class="badge bg-secondary" th:text="${s.rollNumber}"></span></td>
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
                                                 style="width:34px;height:34px;font-size:14px"
                                                 th:text="${s.fullName.substring(0,1).toUpperCase()}"></div>
                                            <span th:text="${s.fullName}"></span>
                                        </div>
                                    </td>
                                    <td th:text="${s.email ?: '—'}"></td>
                                    <td th:text="${s.phone ?: '—'}"></td>
                                </tr>
                                <tr th:if="${students.empty}">
                                    <td colspan="5" class="text-center text-muted py-4">No students added yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
