<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Departments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: adminNav}"></div>

<div class="container py-4">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="bi bi-building me-2"></i>Add Department</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/departments/add}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Department Name</label>
                            <input name="name" class="form-control" placeholder="e.g. Computer Science" required/>
                        </div>
                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-plus-circle me-1"></i>Add Department
                        </button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0"><i class="bi bi-list-ul me-2"></i>All Departments</h5>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-secondary">
                            <tr><th>#</th><th>Department Name</th><th>Students</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="d, i : ${departments}">
                                <td th:text="${i.count}"></td>
                                <td>
                                    <i class="bi bi-building me-2 text-success"></i>
                                    <strong th:text="${d.name}"></strong>
                                </td>
                                <td>
                                    <span class="badge bg-primary"
                                          th:text="${d.students != null ? d.students.size() : 0} + ' students'"></span>
                                </td>
                            </tr>
                            <tr th:if="${departments.empty}">
                                <td colspan="3" class="text-center text-muted py-4">No departments found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
